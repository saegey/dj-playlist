[project]
name = "download-worker"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "redis==8.1.0",
    "yt-dlp==2026.7.4",
    "gamdl==3.8.1",
    "requests==2.33.0",
    "psycopg2-binary>=2.9.9,<2.10",
    "groovenet-python-client",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "fakeredis>=2.20",
]

[tool.uv.sources]
groovenet-python-client = { path = "../packages/groovenet-python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
