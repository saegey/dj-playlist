[project]
name = "groovenet-python-client"
version = "1.0.0"
description = "Small synchronous Groovenet API client for Python workers"
requires-python = ">=3.12"
dependencies = ["requests>=2.32,<3"]
readme = "README.md"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groovenet_client"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
