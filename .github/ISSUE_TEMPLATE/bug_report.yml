name: Bug report
description: Report a reproducible problem with the app, services, CLI, or tooling
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include enough detail for someone else to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the problem.
      placeholder: |
        1. Run `...`
        2. Open `...`
        3. Click `...`
        4. Observe `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Describe what actually happened.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Affected area
      description: Which parts of the project are affected?
      placeholder: e.g. Next.js app, GA service, download worker, CLI, Docker Compose, iOS app
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, stack traces, or screenshots
      description: Paste any relevant output or screenshots.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include anything relevant about your setup.
      placeholder: |
        OS:
        Browser:
        Node version:
        Python version:
        Docker version:
        Deployment mode:
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add anything else that might help.
