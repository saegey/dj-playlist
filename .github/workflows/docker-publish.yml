name: Build and Publish Docker Images

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      myapp: ${{ steps.filter.outputs.myapp }}
      essentia: ${{ steps.filter.outputs.essentia }}
      ga_service: ${{ steps.filter.outputs.ga_service }}
      download_worker: ${{ steps.filter.outputs.download_worker }}
      force_all: ${{ steps.filter.outputs.force_all }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed build inputs
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_ref" "$head_ref")"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
          fi

          echo "Changed files:"
          echo "$changed_files"

          myapp=false
          essentia=false
          ga_service=false
          download_worker=false
          force_all=false

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue

            case "$file" in
              .github/workflows/docker-publish.yml|justfile)
                force_all=true
                ;;
            esac

            case "$file" in
              my-collection-search/*)
                myapp=true
                ;;
            esac

            case "$file" in
              essentia-api/*)
                essentia=true
                ;;
            esac

            case "$file" in
              ga-service/*)
                ga_service=true
                ;;
            esac

            case "$file" in
              download-worker/*|packages/groovenet-python/*)
                download_worker=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            force_all=true
          fi

          echo "myapp=$myapp" >> "$GITHUB_OUTPUT"
          echo "essentia=$essentia" >> "$GITHUB_OUTPUT"
          echo "ga_service=$ga_service" >> "$GITHUB_OUTPUT"
          echo "download_worker=$download_worker" >> "$GITHUB_OUTPUT"
          echo "force_all=$force_all" >> "$GITHUB_OUTPUT"

  build-myapp:
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.myapp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          tags="ghcr.io/${{ github.repository_owner }}/myapp:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" ]]; then
            tags="${tags}"$'\n'"ghcr.io/${{ github.repository_owner }}/myapp:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push myapp
        uses: docker/build-push-action@v6
        with:
          context: ./my-collection-search
          file: ./my-collection-search/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=myapp
          cache-to: type=gha,mode=max,scope=myapp
          build-args: |
            OPENAI_API_KEY=dummy
            DISCOGS_USER_TOKEN=dummytoken
            DISCOGS_USERNAME=dummyusername
            DISCOGS_FOLDER_ID=dummyfolderid
            APPLE_MUSIC_TEAM_ID=dummyteamid
            APPLE_MUSIC_KEY_ID=dummykid
            APPLE_MUSIC_PRIVATE_KEY_PATH=/path/to/dummy/private/key.pem
            DATABASE_URL=postgres://djplaylist:djplaylistpassword@db:5432/djplaylist
            YOUTUBE_API_KEY=dummyyoutubeapikey

  build-essentia:
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.essentia == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          tags="ghcr.io/${{ github.repository_owner }}/essentia-api:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" ]]; then
            tags="${tags}"$'\n'"ghcr.io/${{ github.repository_owner }}/essentia-api:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Essentia API
        uses: docker/build-push-action@v6
        with:
          context: ./essentia-api
          file: ./essentia-api/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=essentia-api
          cache-to: type=gha,mode=max,scope=essentia-api

  build-ga-service:
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.ga_service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          tags="ghcr.io/${{ github.repository_owner }}/ga-service:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" ]]; then
            tags="${tags}"$'\n'"ghcr.io/${{ github.repository_owner }}/ga-service:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push GA service
        uses: docker/build-push-action@v6
        with:
          context: ./ga-service
          file: ./ga-service/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ga-service
          cache-to: type=gha,mode=max,scope=ga-service

  build-download-worker:
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.download_worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          tags="ghcr.io/${{ github.repository_owner }}/download-worker:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" ]]; then
            tags="${tags}"$'\n'"ghcr.io/${{ github.repository_owner }}/download-worker:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push download worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./download-worker/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=download-worker
          cache-to: type=gha,mode=max,scope=download-worker
