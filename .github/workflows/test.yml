name: Test

on:
  # main is covered by the gate call from docker-publish.yml, so don't
  # self-run here on main (avoids duplicate test runs).
  push:
    branches-ignore:
      - main
  pull_request:
  # Allows docker-publish.yml to call this as a gate before building images.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm
        with:
          cache-dependency-path: |
            package-lock.json
            my-collection-search/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace=@groovenet/contracts

      - name: Install web dependencies
        run: npm ci --prefix my-collection-search

      - name: Lint web app
        working-directory: my-collection-search
        run: npm run lint

      - name: Lint Node packages
        run: |
          npm run lint --workspace=@groovenet/contracts
          npm run lint --workspace=@groovenet/client
          npm run lint --workspace=@groovenet/cli
          npm run lint --workspace=mcp-server

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Node 26's experimental server-side Web Storage shadows jsdom's
    # localStorage, which browser-component tests rely on.
    env:
      NODE_OPTIONS: --no-experimental-webstorage
    defaults:
      run:
        working-directory: my-collection-search

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm
        with:
          cache-dependency-path: |
            package-lock.json
            my-collection-search/package-lock.json

      - name: Install workspace dependencies
        run: npm ci --prefix ..

      - name: Build shared contracts
        run: npm run build --workspace=@groovenet/contracts --prefix ..

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # The audio ingest route validates uploads by probing the media (#275),
      # and its tests skip themselves when ffprobe is missing rather than
      # failing — install it and assert it, or coverage quietly narrows.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify ffprobe is available
        run: ffprobe -version

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      # Run after Vitest, which clears coverage/ before generating its reports.
      - name: Test Storybook bundle validation with coverage
        run: |
          docker compose version
          npm run test:storybook
          # Node reports paths relative to this job's app working directory.
          sed -i 's#^SF:scripts/#SF:my-collection-search/scripts/#' coverage/storybook.lcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: my-collection-search-coverage
          path: |
            my-collection-search/coverage
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: my-collection-search/coverage/lcov.info,my-collection-search/coverage/storybook.lcov
          flags: webapp
          disable_search: true
          fail_ci_if_error: false

      - name: Coverage summary
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  client-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm --workspace @groovenet/contracts run build

      - name: Run client tests with coverage
        run: npm --workspace @groovenet/client run test:coverage

      - name: Test npm toolchain drift checks with coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=scripts/check-npm-toolchain.mjs
          --test-reporter=spec --test-reporter=lcov
          --test-reporter-destination=stdout
          --test-reporter-destination=packages/groovenet-client/coverage/npm-toolchain.lcov
          scripts/npm-toolchain.test.mjs

      - name: Upload client coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/groovenet-client/coverage/lcov.info
          flags: groovenet-client
          disable_search: true
          fail_ci_if_error: false

      - name: Upload npm toolchain coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/groovenet-client/coverage/npm-toolchain.lcov
          flags: npm-toolchain
          disable_search: true
          fail_ci_if_error: false

  contracts-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests with coverage
        run: npm --workspace @groovenet/contracts run test:coverage

      - name: Upload contracts coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/groovenet-contracts/coverage/lcov.info
          flags: groovenet-contracts
          disable_search: true
          fail_ci_if_error: false

  cli-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      # The CLI resolves its client from the build output; both depend on contracts.
      - name: Build the packages
        run: |
          npm --workspace @groovenet/contracts run build
          npm --workspace @groovenet/client run build

      - name: Run CLI tests with coverage
        run: npm --workspace @groovenet/cli run test:coverage

      - name: Run MCP server tests
        run: npm --workspace mcp-server test

      - name: Test embedding evaluation harnesses (#379, #382, #409, #424)
        run: node --test evaluations/379/*.test.mjs evaluations/382/*.test.mjs evaluations/409/*.test.mjs evaluations/424/*.test.mjs

      - name: Upload CLI coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/groovenet-cli/coverage/lcov.info
          flags: groovenet-cli
          disable_search: true
          fail_ci_if_error: false

  python-client-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm
        with:
          cache-dependency-path: my-collection-search/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install app dependencies and generate the API contract
        run: |
          npm ci
          npm --workspace @groovenet/contracts run build
          npm ci --prefix my-collection-search
          npm run openapi:generate-spec --prefix my-collection-search

      - name: Run Python client tests and contract checks with coverage
        working-directory: packages/groovenet-python
        env:
          GROOVENET_REQUIRE_OPENAPI: "1"
        run: uv run --locked --group dev pytest --cov=groovenet_client --cov-branch --cov-report=xml:coverage.xml

      - name: Build Python client distributions
        working-directory: packages/groovenet-python
        run: uv build

      - name: Upload Python client coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/groovenet-python/coverage.xml
          flags: groovenet-python
          disable_search: true
          fail_ci_if_error: false

  download-worker-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: download-worker

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run worker tests with coverage
        run: uv run --group dev pytest --cov=. --cov-report=xml:coverage.xml

      - name: Upload worker coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: download-worker/coverage.xml
          flags: download-worker
          disable_search: true
          fail_ci_if_error: false

  ga-service-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ga-service

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run GA service tests with coverage
        run: uv run --group dev pytest --cov=. --cov-report=xml:coverage.xml

      - name: Upload GA service coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ga-service/coverage.xml
          flags: ga-service
          disable_search: true
          fail_ci_if_error: false

  fingerprint-service-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fingerprint-service

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      # The decode tests skip themselves when ffmpeg is missing rather than
      # failing, so install it explicitly and then assert it is there — an
      # image that silently dropped it would quietly narrow coverage instead.
      # libchromaprint is not optional at all: `pyacoustid` imports fine
      # without it and only raises when asked to fingerprint, so a missing
      # library would surface as every matcher test erroring at once.
      # Cached across runs so a healthy mirror is only hit once; a flaky
      # mirror gets a second attempt before we give up, and both attempts are
      # time-boxed so a hung apt-get fails the job instead of the step eating
      # GitHub's 6-hour default (#462).
      # execute_install_scripts runs each package's postinst, same as a real
      # apt-get install — libblas3 needs it to register its libblas.so.3
      # alternative, which otherwise never gets created and fails ffmpeg at
      # runtime even though the restored files are all on disk.
      - name: Install ffmpeg and libchromaprint
        id: apt-install
        uses: awalsh128/cache-apt-pkgs-action@v1
        timeout-minutes: 10
        continue-on-error: true
        with:
          packages: ffmpeg libchromaprint1
          version: 1.0
          execute_install_scripts: true

      # A timed-out attempt can leave ~/cache-apt-pkgs holding a partial
      # download (it's a plain staging dir, not the GitHub Actions cache, so
      # nothing else clears it) — wipe it so the retry does a real fresh
      # install instead of restoring an incomplete package set.
      - name: Clear apt staging dir before retry
        if: steps.apt-install.outcome == 'failure'
        run: rm -rf ~/cache-apt-pkgs

      - name: Install ffmpeg and libchromaprint (retry)
        if: steps.apt-install.outcome == 'failure'
        uses: awalsh128/cache-apt-pkgs-action@v1
        timeout-minutes: 10
        with:
          packages: ffmpeg libchromaprint1
          version: 1.0
          execute_install_scripts: true

      - name: Verify ffmpeg and libchromaprint are available
        run: |
          ffmpeg -version
          uv run python -c "import chromaprint; print('libchromaprint', chromaprint._libchromaprint.chromaprint_get_version())"

      - name: Run fingerprint service tests with coverage
        run: uv run --group dev pytest --cov=fingerprint_service --cov-report=xml:coverage.xml

      - name: Upload fingerprint service coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: fingerprint-service/coverage.xml
          flags: fingerprint-service
          disable_search: true
          fail_ci_if_error: false

  migrate-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: my-collection-search
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: djplaylist
          POSTGRES_PASSWORD: test
          POSTGRES_DB: djplaylist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djplaylist -d djplaylist"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm
        with:
          cache-dependency-path: my-collection-search/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migration test (up + down + up)
        run: bash ./scripts/migrate-test.sh
        env:
          DATABASE_URL: postgres://djplaylist:test@localhost:5432/djplaylist

      # Reuses the schema the step above just re-applied.
      - name: Run fingerprint schema integration tests
        run: npm run test:fingerprints
        env:
          DATABASE_URL: postgres://djplaylist:test@localhost:5432/djplaylist

  redis-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: my-collection-search
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm
        with:
          cache-dependency-path: my-collection-search/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Redis integration tests
        run: npm run test:redis
        env:
          REDIS_URL: redis://localhost:6379
