# Production compose template extending docker-compose.yml.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
services:
  app:
    image: ${REGISTRY:-ghcr.io/public-vinyl-radio}/webapp:${IMAGE_TAG:-latest}
    container_name: webapp
    env_file:
      - .env
    environment:
      # Surfaced on the About page (/api/version). Reflects the deployed image
      # tag at runtime so it stays accurate without a rebuild.
      APP_VERSION: ${IMAGE_TAG:-latest}
      GA_SERVICE_URL: ${GA_SERVICE_URL:-http://ga-service:8002}
      APPLE_MUSIC_TEAM_ID: ${APPLE_MUSIC_TEAM_ID}
      APPLE_MUSIC_KEY_ID: ${APPLE_MUSIC_KEY_ID}
      APPLE_MUSIC_PRIVATE_KEY: ${APPLE_MUSIC_PRIVATE_KEY}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-none}
      POSTHOG_KEY: ${POSTHOG_KEY:-${NEXT_PUBLIC_POSTHOG_KEY:-}}
      POSTHOG_HOST: ${POSTHOG_HOST:-${NEXT_PUBLIC_POSTHOG_HOST:-}}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      SENTRY_DSN: ${SENTRY_DSN}
    volumes:
      - ${APP_AUDIO_MOUNT:-music_data:/app/audio}
      - db_dumps:/app/dumps
      - discogs_exports:/app/discogs_exports
      - cookie_data:/app/cookies
      - album_covers:/app/public/uploads/album-covers
      - essentia_data:/app/essentia-data
      # Storybook is packaged in the image at /app/public/storybook.
      # Do not mount over it; STORYBOOK_STATIC_DIR is no longer supported.
    networks:
      # Keep the old `myapp` name resolvable on the network so existing reverse
      # proxies (e.g. Caddy: reverse_proxy myapp:3000) keep working after the
      # container was renamed to `webapp`.
      default:
        aliases:
          - myapp
    restart: unless-stopped

  migrate:
    # Must not share the app image tag. `docker compose run --build migrate`
    # builds the `migrator` target, and reusing the app tag clobbers the
    # runner image with a stage that falls back to the base Node CMD.
    image: ${REGISTRY:-ghcr.io/public-vinyl-radio}/webapp-migrate:${IMAGE_TAG:-latest}

  db:
    container_name: db

  redis:
    container_name: redis

  essentia:
    image: ${REGISTRY:-ghcr.io/public-vinyl-radio}/essentia-api:${IMAGE_TAG:-latest}
    container_name: essentia-api

  ga-service:
    image: ${REGISTRY:-ghcr.io/public-vinyl-radio}/ga-service:${IMAGE_TAG:-latest}
    container_name: ga-service

  fingerprint-service:
    image: ${REGISTRY:-ghcr.io/public-vinyl-radio}/fingerprint-service:${IMAGE_TAG:-latest}
    container_name: fingerprint-service
    restart: unless-stopped

  fingerprint-set-worker:
    image: ${REGISTRY:-ghcr.io/public-vinyl-radio}/fingerprint-service:${IMAGE_TAG:-latest}
    container_name: fingerprint-set-worker
    restart: unless-stopped

  download-worker:
    image: ${REGISTRY:-ghcr.io/public-vinyl-radio}/download-worker:${IMAGE_TAG:-latest}
    container_name: download-worker
    volumes:
      # Keep worker and app pointed at the same backing store for /app/audio.
      - ${WORKER_AUDIO_MOUNT:-music_data:/app/audio}
      - album_covers:/app/public/uploads/album-covers
      - cookie_data:/app/cookies
      - essentia_data:/app/essentia-data
    restart: unless-stopped

# Every volume below is external and its name comes from a required env var
# with no fallback default. A literal shared default (e.g. "teststack_db_data")
# is exactly what let two differently-named deploys (PROJECT_NAME=dj-playlist
# and PROJECT_NAME=groovenet, both from /srv/docker/groovenet) silently mount
# the same Postgres data directory at once on 2026-10-11, corrupting it beyond
# repair. Requiring each PROD_*_VOLUME var to be set in this host's .env makes
# a second, differently-named deploy fail loudly on startup instead of quietly
# sharing another stack's data. See groovenet#538 for the incident.
volumes:
  db_data:
    name: ${PROD_DB_DATA_VOLUME:?Set PROD_DB_DATA_VOLUME in .env to this host's db_data volume name}
    external: true
  music_data:
    name: ${PROD_MUSIC_DATA_VOLUME:?Set PROD_MUSIC_DATA_VOLUME in .env to this host's music_data volume name}
    external: true
  db_dumps:
    name: ${PROD_DB_DUMPS_VOLUME:?Set PROD_DB_DUMPS_VOLUME in .env to this host's db_dumps volume name}
    external: true
  discogs_exports:
    name: ${PROD_DISCOGS_EXPORTS_VOLUME:?Set PROD_DISCOGS_EXPORTS_VOLUME in .env to this host's discogs_exports volume name}
    external: true
  redis_data:
    name: ${PROD_REDIS_DATA_VOLUME:?Set PROD_REDIS_DATA_VOLUME in .env to this host's redis_data volume name}
    external: true
  cookie_data:
    name: ${PROD_COOKIE_DATA_VOLUME:?Set PROD_COOKIE_DATA_VOLUME in .env to this host's cookie_data volume name}
    external: true
  album_covers:
    name: ${PROD_ALBUM_COVERS_VOLUME:?Set PROD_ALBUM_COVERS_VOLUME in .env to this host's album_covers volume name}
    external: true
  essentia_data:
    name: ${PROD_ESSENTIA_DATA_VOLUME:?Set PROD_ESSENTIA_DATA_VOLUME in .env to this host's essentia_data volume name}
    external: true
